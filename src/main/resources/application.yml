spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: vodtbank
  profiles:
    active: mysql
### JPA Configuration ###
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

### Jwt Configuration ###
jwt:
  public-path: ${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/public.pem}
  private-path: ${JWT_PRIVATE_KEY_LOCATION:classpath:jwt/private.pem}
  expiration: ${JWT_EXPIRATION:3600000} # milliseconds